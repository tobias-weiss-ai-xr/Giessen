<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <style>
    .node { stroke: #333; stroke-width: 2; fill: #f8f8f8; font-family: Arial, sans-serif; font-size: 14px; text-anchor: middle; }
    .node circle { stroke: #571EFA; stroke-width: 2; fill: #ECECFF; }
    .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
    .label { font-family: Arial, sans-serif; font-size: 12px; fill: #333; text-anchor: middle; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
  <circle cx="100" cy="100" r="40" class="node">
    <text x="100" y="95">Mensch</text>
    <text x="100" y="110" font-size="10">(Entscheidet)</text>
  </circle>
  <rect x="240" y="80" width="100" height="40" class="node">
    <text x="290" y="95">Agent</text>
    <text x="290" y="110" font-size="10">(Schlägt vor)</text>
  </rect>
  <path d="M140 100 L240 100" class="arrow"/>
  <text x="190" y="85" class="label">kontrolliert</text>
  <path d="M290 100 L140 100" class="arrow"/>
  <text x="190" y="115" class="label">unterstützt</text>
</svg>
